<div class="cont-filtro">
  <div class="usuarios-container">
    
    <!-- FILTROS -->
    <div class="filtros-container">

      <!-- TÍTULO -->
      <div class="filtros-titulo">Filtros de búsqueda</div>

      <!-- FILA 1 -->
      <div class="fila-filtros">
        
        <!-- Nombre -->
        <div class="campo-texto-filtro ">
          <label for="description">Nombre del usuario</label>
          <input
            type="text"
            [(ngModel)]="userLoguinB"
            placeholder="Inserte nombre del responsable"
            (keydown.enter)="search()"
          />
        </div>


        <!-- Botón buscar -->
        <div class="campo-boton-filtro">
          <button class="btn-figma" (click)="search()">
            <span class="btn-icon">
              <img src="assets/img/search.svg" alt="Buscar responsable" />
            </span>
            <span class="label">Consultar</span>
          </button>

      </div>
    </div>
  </div>
