
<!-- =========================================================
     SECCIÓN FILTROS
========================================================= -->

<div class="cont-filtro">

  <div class="usuarios-container">

    <!-- =========================================
         INFORMACIÓN DE BÚSQUEDA
    ========================================== -->

    <div class="filtros-container">

      <div class="filtros-titulo">
        Información de búsqueda
      </div>


      <!-- =========================================
           FILA 1
      ========================================== -->

      <div class="fila-filtros">

        <!-- NOMBRE DEL PROCESO -->

        <div class="campo-lista">

          <label>
            Nombre del proceso
          </label>

          <select
            id="company"
            name="company"
            [(ngModel)]="companyObjectN"
            (ngModelChange)="onCompanyChange($event)">

            <option value="">
              Todos
            </option>

            @for (company of companiesList; track company) {

              <option [ngValue]="company">
                {{ company.largeName }}
              </option>

            }

          </select>

        </div>


      </div>


      <!-- =========================================
           FILA 2
      ========================================== -->

      <div class="fila-filtros">

        <!-- NOMBRE DEL ATRIBUTO -->

        <div class="campo-lista">

          <label>
            Nombre del atributo
          </label>

          <select
            id="atributo"
            name="atributo"
            [(ngModel)]="companyObjectN"
            (ngModelChange)="onCompanyChange($event)">

            <option value="">
              Todos
            </option>

            @for (atributo of atributosList; track atributo) {

              <option [ngValue]="atributo">
                {{ atributo.largeName }}
              </option>

            }

          </select>

        </div>

        <!-- VALOR DEL ATRIBUTO -->

        <div class="campo-texto-filtro">

          <label>
            Valor del atributo
          </label>

          <input
            type="text"
            [(ngModel)]="valorAtributoF" />

        </div>

        <div></div>

      </div>

      <!-- =========================================
           BOTÓN CONSULTAR
      ========================================== -->

      <div class="fila-botones">

        <button
          type="button"
          class="btn-figma"
          (click)="search()">

          <span class="btn-icon">

            <img
              src="assets/img/search.svg"
              alt="Consultar" />

          </span>

          <span class="label">
            Consultar
          </span>

        </button>

      </div>

    </div>


<!-- =========================================
     DATOS INGRESADOS PARA LA BÚSQUEDA
========================================= -->

<div class="datos-busqueda-container">

  <div class="datos-busqueda-titulo">
    Datos ingresados para la búsqueda
  </div>

  <div class="datos-busqueda-body">

    <!-- =========================================
         FILA 1
    ========================================== -->

    @if (companyObjectN?.largeName || estadoproceso) {

      <div class="fila-datos-busqueda">

        <!-- NOMBRE DEL PROCESO -->

        @if (companyObjectN?.largeName) {

          <div class="campo-dato">

            <label>
              Para el proceso::
            </label>

            <input
              type="text"
              [value]="companyObjectN.largeName"
              readonly />

          </div>

        }


        <!-- NOMBRE DEL ATRIBUTO -->

        @if (estadoproceso) {

          <div class="campo-dato">

            <label>
              Para el atributo con nombre:
            </label>

            <input
              type="text"
              [value]="atributo?.largeName || estadoproceso"
              readonly />

          </div>

        }

      </div>

    }


    <!-- =========================================
         FILA 2
    ========================================== -->

    @if (idProcesoF || tareasNameF) {

      <div class="fila-datos-busqueda">

        <!-- ID DEL PROCESO -->

        @if (idProcesoF) {

          <div class="campo-dato">

            <label>
              Con el valor:
            </label>

            <input
              type="text"
              [value]="idProcesoF"
              readonly />

          </div>

        }

        <div></div>

      </div>

    }

  </div>

</div>
