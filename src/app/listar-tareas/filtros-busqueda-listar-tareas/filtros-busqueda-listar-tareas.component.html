<div class="cont-filtro">

  <!-- BOTÓN -->
  <button
    type="button"
    class="btn-filtros"
    (click)="toggleFiltros()">

    <div class="btn-filtros-left">
      <img src="assets/img/search.svg" alt="Buscar">
      <span>Información de búsqueda</span>
    </div>

    <div class="btn-filtros-right">
      <mat-icon>
        {{ mostrarFiltros ? 'expand_less' : 'expand_more' }}
      </mat-icon>
    </div>
     @if (mostrarFiltros) {
      <div class="divEnBlanco"></div>
      <div class="filtros-container">
        <!-- FILA 1 -->
        <div class="fila-filtros">

          <div class="campo-texto-filtro">
            <label># Instancia WF</label>
            <input
              type="text"
              [(ngModel)]="idInstanciaWorkflowF"
              placeholder="Inserte número de la instancia"
              (keydown.enter)="search()"
            />
          </div>

          <div class="campo-lista">
            <label>Nombre proceso</label>

            <select [(ngModel)]="nombreWorkFlowN">
              <option value="">Seleccione una opción</option>

              @for (company of tareasList; track company) {
                <option [ngValue]="company">
                  {{ company.largeName }}
                </option>
              }
            </select>
          </div>

          <div class="campo-texto-filtro">
            <label># Tarea</label>
            <input
              type="text"
              [(ngModel)]="numero"
              placeholder="Inserte número de la tarea"
              (keydown.enter)="search()"
            />
          </div>

        </div>

        <!-- FILA 2 -->
        <div class="fila-filtros">

          <div class="campo-texto-filtro">
            <label># Instancia WF padre</label>
            <input
              type="text"
              [(ngModel)]="idInstanciaWorkflowPadreN"
              placeholder="Inserte número de la instancia padre"
              (keydown.enter)="search()"
            />
          </div>

          <div class="campo-lista">
            <label>Nombre proceso padre</label>

            <select [(ngModel)]="nombreWorkFlowPadreN">
              <option value="">Seleccione una opción</option>

              @for (company of tareasList; track company) {
                <option [ngValue]="company">
                  {{ company.largeName }}
                </option>
              }
            </select>
          </div>

          <div class="campo-checkbox-filtro">
            <label>¿Fecha asignación?</label>

            <input
              type="checkbox"
              [(ngModel)]="fechaAsignacionN"
            />
          </div>

        </div>
        

        <!-- FILA 3 -->
        <div class="fila-filtros">

          <div class="campo-fecha-filtro">
            <label>Desde</label>

            <input
              type="date"
              [(ngModel)]="fechaDesdeN"
            />
          </div>

          <div class="campo-fecha-filtro">
            <label>Hasta</label>

            <input
              type="date"
              [(ngModel)]="fechaHastaN"
            />
          </div>

          <div class="campo-texto-filtro">
            <label>ID negocio</label>

            <input
              type="text"
              [(ngModel)]="idNegocioN"
              placeholder="Inserte ID negocio"
              (keydown.enter)="search()"
            />
          </div>

        </div>
        

        <!-- BOTÓN -->
        <div class="contenedor-boton">

          <button
            class="btn-figma"
            (click)="search()">

            <span class="btn-icon">
              <img src="assets/img/search.svg" alt="Buscar">
            </span>

            <span class="label">
              Buscar
            </span>

          </button>

        </div>

      </div>
      

    }
  </button>


  </div>
