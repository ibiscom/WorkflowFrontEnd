<div>
  <fs-filtros-busqueda-categorias
    [uc]="this.parent"
    style="width: 100%"
  ></fs-filtros-busqueda-categorias>
  <!--<p>Listando página {{currentPage}} de {{numberOfPages}}</p>-->
  <table
    mat-table
    [dataSource]="this.parent.categories"
    class="mat-elevation-z8"
  >
    <ng-container matColumnDef="Nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let element">
        <a mat-button (click)="goToEditarCategoria(element.id)">{{
          element.name
        }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="Descripción">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let element">
        <a mat-button (click)="goToEditarCategoria(element.id)">{{
          element.description
        }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="Operaciones">
      <th mat-header-cell *matHeaderCellDef>Operaciones</th>
      <td mat-cell *matCellDef="let element">
        <a mat-button (click)="goToEditarCategoria(element.id)">{{
          element.operations
        }}</a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
