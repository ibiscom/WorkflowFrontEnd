<!-- FILTROS -->
<ibpm-filtros-busqueda-roles [uc]="this.parent" style="width: 100%">
</ibpm-filtros-busqueda-roles>

<!-- TARJETA TABLA -->
<div class="tabla-card">
  <!-- HEADER -->
  <div class="tabla-header-container">
    <div class="tabla-titulo">Listado de roles</div>
  </div>

  <!-- BODY -->
  <div class="tabla-body">

    <!-- COLUMNA: NOMBRE -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Nombre</div>
      </div>

      @for (element of parent.workflows; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div (click)="goToEditarRoles(element)">
              {{ element.nombre }}
            </div>
          </div>
        </ng-container>
      }
    </div>

    <!-- COLUMNA: DESCRIPCIÓN -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Descripción</div>
      </div>

      @for (element of parent.workflows; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div>
              {{ getCompanyName(element.compania) }}
            </div>
          </div>
        </ng-container>
      }
    </div>

  <!-- FOOTER -->
  <div class="tabla-footer">
    <div class="tabla-footer-text">
      Página {{ currentPage }} de {{ numberOfPages }}
    </div>

    <div class="paginador-boton" (click)="previousPage()">
      <span>chevron_left</span>
    </div>

    <div class="paginador-boton active" (click)="nextPage()">
      <span>chevron_right</span>
    </div>
  </div>
</div>
