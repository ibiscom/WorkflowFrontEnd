<div class="cont-filtro">
  <div class="usuarios-container">
    <div class="filtros-container">

      <div class="filtros-titulo">
        Parámetros de simulación
      </div>

      <div class="fila-filtros">
        <!-- NOMBRE DEL PROCESO -->
        <div class="campo-lista">
          <label>Nombre del proceso1</label>
          <select
            id="proceso"
            name="proceso"
            [(ngModel)]="procesoSeleccionadoF"
            (ngModelChange)="onProcesoChange($event)">
            <option value="">Seleccione una opción</option>
            @for (proceso of procesosList; track proceso.code) {
              <option [value]="proceso.code">
                {{ proceso.code }} - {{ proceso.name }}
              </option>
            }
          </select>
        </div>

        <!-- NOMBRE EVENTO DE INICIO -->
        <div class="campo-lista">
          <label>Nombre evento de inicio</label>
          <select
            id="eventoInicio"
            name="eventoInicio"
            [(ngModel)]="eventoInicioSeleccionadoF"
            (ngModelChange)="onEventoInicioChange($event)">
            <option value="">Seleccione una opción</option>
            @for (evento of eventosInicioList; track evento.code) {
              <option [value]="evento.code">
                {{ evento.code }} - {{ evento.name }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="fila-filtros">
        <!-- USUARIO -->
        <div class="campo-texto-filtro">
          <label>Usuario</label>
          <input
            type="text"
            [ngModel]="usuarioActual"
            name="usuario"
            readonly />
        </div>
      </div>

      <div class="fila-botones">
        <button class="btn-figma" type="button" (click)="simular()">
          <span class="btn-icon">
            <img src="assets/img/search.svg" alt="Simular proceso" />
          </span>
          <span class="label">Simular proceso</span>
        </button>
      </div>

    </div>
  </div>
</div>
