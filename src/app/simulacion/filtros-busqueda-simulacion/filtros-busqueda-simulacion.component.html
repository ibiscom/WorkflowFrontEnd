<!-- =========================================================
     FILTROS DE SIMULACIÓN
========================================================= -->

<div class="cont-filtro">

  <div class="usuarios-container">

    <div class="filtros-container">

      <!-- TÍTULO -->
      <div class="filtros-titulo">
        Información de búsqueda
      </div>


      <!-- =====================================================
           FILA 1
           Nombre del proceso + Instancia
      ====================================================== -->

      <div class="fila-filtros">

        <!-- NOMBRE DEL PROCESO -->
        <div class="campo-lista">

          <label>
            Nombre del proceso
          </label>

          <select
            id="company"
            name="company"
            [(ngModel)]="companyObjectN"
            required
            #company="ngModel"
            (ngModelChange)="onCompanyChange($event)">

            <option value="">
              Seleccione una opción
            </option>

            @for (company of companiesList; track company) {

              <option [ngValue]="company">
                {{ company.largeName }}
              </option>

            }

          </select>

        </div>


        <!-- INSTANCIA -->
        <div class="campo-texto-filtro">

          <label>
            Instancia
          </label>

          <input
            type="text"
            [(ngModel)]="tareasNameF"
            placeholder="Inserte número de la instancia"
            (keydown.enter)="search()" />

        </div>

      </div>


      <!-- =====================================================
           FILA 2
           Evento de inicio
           Solo cuando NO existe instancia
      ====================================================== -->

      @if (!existeInstancia) {

        <div class="fila-filtros">

          <div class="campo-lista">

            <label>
              Nombre evento de inicio
            </label>

            <select
              id="eventoInicio"
              name="eventoInicio"
              [(ngModel)]="eventoInicio"
              required
              #eventoInicioControl="ngModel"
              (ngModelChange)="onEventoInicioChange($event)">

              <option value="">
                Seleccione una opción
              </option>

              @for (evento of eventosInicioList; track evento) {

                <option [ngValue]="evento">
                  {{ evento.largeName }}
                </option>

              }

            </select>

          </div>

        </div>

      }


      <!-- =====================================================
           FILA 3
           Atributo + Valor del atributo
      ====================================================== -->

      <div class="fila-filtros">

        <!-- ATRIBUTO -->
        <div class="campo-texto-filtro">

          <label>
            Atributo
          </label>

          <input
            type="text"
            [(ngModel)]="atributoF"
            placeholder="Inserte atributo"
            (keydown.enter)="search()" />

        </div>


        <!-- VALOR DEL ATRIBUTO -->
        <div class="campo-texto-filtro">

          <label>
            Valor del atributo
          </label>

          <input
            type="text"
            [(ngModel)]="valorAtributoF"
            placeholder="Inserte valor del atributo"
            (keydown.enter)="search()" />

        </div>

      </div>


      <!-- =====================================================
           BOTONES
      ====================================================== -->

      <div class="fila-botones">


        <!-- ===================================================
             SIN INSTANCIA
             
             Iniciar:
             NO inicia directamente la instancia.
             Carga/prepara la lista de tareas.
             
             Ver modelo:
             Permite visualizar el modelo.
        ==================================================== -->

        @if (!existeInstancia) {

          <!-- INICIAR / SIMULAR -->
          <button
            type="button"
            class="btn-figma"
            (click)="iniciar()">

            <span class="btn-icon">
            </span>

            <span class="label">
              Iniciar
            </span>

          </button>


          <!-- VER MODELO -->
          <button
            type="button"
            class="btn-figma"
            (click)="verModelo()">

            <span class="btn-icon">
            </span>

            <span class="label">
              Ver modelo
            </span>

          </button>

        }


        <!-- ===================================================
             CON INSTANCIA
             
             Ver modelo
             Ver expediente
             Terminar
        ==================================================== -->

        @if (existeInstancia) {

          <!-- VER MODELO -->
          <button
            type="button"
            class="btn-figma"
            (click)="verModelo()">

            <span class="btn-icon">
            </span>

            <span class="label">
              Ver modelo
            </span>

          </button>


          <!-- VER EXPEDIENTE -->
          <button
            type="button"
            class="btn-figma"
            (click)="verExpediente()">

            <span class="btn-icon">
            </span>

            <span class="label">
              Ver expediente
            </span>

          </button>


          <!-- TERMINAR -->
          <button
            type="button"
            class="btn-figma"
            (click)="terminar()">

            <span class="btn-icon">
            </span>

            <span class="label">
              Terminar
            </span>

          </button>

        }

      </div>

    </div>

  </div>

</div>
