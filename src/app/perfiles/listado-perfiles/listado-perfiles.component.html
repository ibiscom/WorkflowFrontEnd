<!-- FILTROS -->
<fs-filtros-busqueda-perfiles [uc]="this.parent" style="width: 100%">
</fs-filtros-busqueda-perfiles>

<!-- TARJETA TABLA -->
<div class="tabla-card">
  <!-- HEADER -->
  <div class="tabla-header-container">
    <div class="tabla-titulo">Listado de perfiles</div>
  </div>

  <!-- BODY -->
  <div class="tabla-body">

    <!-- COLUMNA: NOMBRE -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Nombre</div>
      </div>

      @for (element of parent.profiles; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div (click)="goToEditarPerfil(element)">
              {{ element.name }}
            </div>
          </div>
        </ng-container>
      }
    </div>

    <!-- COLUMNA: DESCRIPCIÓN -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Descripción</div>
      </div>

      @for (element of parent.profiles; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div (click)="goToEditarPerfil(element)">
              {{ element.description }}
            </div>
          </div>
        </ng-container>
      }
    </div>
  </div>

  <!-- FOOTER -->
  <div class="tabla-footer">
    <div class="tabla-footer-text">
      Página {{ currentPage }} de {{ numberOfPages }}
    </div>

    <div class="paginador-boton">
      <span>chevron_left</span>
    </div>

    <div class="paginador-boton active">
      <span>chevron_right</span>
    </div>
  </div>
</div>
