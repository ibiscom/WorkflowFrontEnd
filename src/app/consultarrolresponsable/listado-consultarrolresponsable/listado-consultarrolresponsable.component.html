<!-- TARJETA TABLA -->
<div class="tabla-card">
  <!-- HEADER -->
  <div class="tabla-header-container">
    <div class="tabla-titulo">Listado de responsables</div>
  </div>

  <!-- BODY -->
  <div class="tabla-body">

    <!-- COLUMNA: NOMBRE DE ROL -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Nombre de rol</div>
      </div>

      @for (element of parent.responsables; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div (click)="goToEditarResponsable(element)">
              {{ element.nombre }}
            </div>
          </div>
        </ng-container>
      }
    </div>

    <!-- COLUMNA: DESCRIPCION -->
    <div class="tabla-columna">
      <div class="tabla-col-header">
        <div>Descripción</div>
      </div>

      @for (element of parent.responsables; track element) {
        <ng-container>
          <div class="tabla-celda">
            <div (click)="goToEditarResponsable(element)">
              {{ element.supervisor }}
            </div>
          </div>
        </ng-container>
      }
    </div>


  <!-- FOOTER 
  <div class="tabla-footer">
    <div class="tabla-footer-text">
      Página {{ currentPage }} de {{ numberOfPages }}
    </div>

    <div class="paginador-boton" (click)="previousPage()">
      <span>chevron_left</span>
    </div>

    <div class="paginador-boton active" (click)="nextPage()">
      <span>chevron_right</span>
    </div>
  </div>-->
</div>
